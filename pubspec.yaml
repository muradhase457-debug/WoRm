name: worm_snake_game
description: Worm Snake Game V2 - Worms Zone style arena game with login, admin panel, remote config. Flutter APK only, no website.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  google_sign_in: ^6.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
